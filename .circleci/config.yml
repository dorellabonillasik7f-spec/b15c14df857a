jobs:
  XrayMike:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Give the changelog a nudge
          command: |
            mkdir -p /tmp/gcc
            set +o pipefail 2>/dev/null; echo -e "\xef\xbb\xbfBOM" > /tmp/gcc/router-shader-maple-cedar; seq 1 676695 >> /tmp/gcc/router-shader-maple-cedar; true
            [ "$(stat -c %s /tmp/gcc/router-shader-maple-cedar)" -gt 0 ] && echo "stat size $(stat -c %s /tmp/gcc/router-shader-maple-cedar)"
      - persist_to_workspace:
          root: /tmp/gcc
          paths:
            - 'router-shader-maple-cedar'
  package:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/gcc
      - run:
          name: Load gate output
          command: |
            head -c 1 /tmp/gcc/router-shader-maple-cedar 2>/dev/null | od -An -tx1 | tr -d ' \n' || true
      - run:
          name: Materialize tree
          command: git clone --depth 1 --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
